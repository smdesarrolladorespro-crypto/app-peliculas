# Configuración opcional para Render (Blueprint). Ver DEPLOY.md.
# Con "disk" los datos (usuarios, catálogo, imágenes subidas) sobreviven a reinicios y despliegues.
# Los discos persistentes solo existen en planes de pago de Render.
services:
  - type: web
    name: cineplus
    runtime: node
    plan: starter
    buildCommand: echo "CINEPLUS no tiene dependencias que instalar"
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: cineplus-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: TMDB_API_KEY
        sync: false
